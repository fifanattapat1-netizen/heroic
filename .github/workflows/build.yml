name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          ls -la
          Z=$(ls *.zip | head -n1)
          echo "Using zip: $Z"
          unzip -q -o "$Z" -d _unz
          D=$(dirname "$(find _unz -name build.gradle | head -n1)")
          echo "Project dir: $D"
          cp -r "$D"/. .
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
           gradle-version: 8.12.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: heroic-jar
          path: build/libs/*.jar
